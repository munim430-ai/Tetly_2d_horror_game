<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <!-- Gold glow filter -->
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffd700" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" fill="#0a0a0f"/>

  <!-- Key group with glow filter applied -->
  <g filter="url(#goldGlow)" fill="#d4a017">
    <!-- Key head: circle, centered at (13, 18), r=8 -->
    <circle cx="13" cy="18" r="8" fill="#d4a017"/>

    <!-- Key head inner hole -->
    <circle cx="13" cy="18" r="3.5" fill="#0a0a0f"/>

    <!-- Key shaft: 3x16px rect going right from head -->
    <rect x="19" y="16.5" width="16" height="3" rx="1" fill="#d4a017"/>

    <!-- Tooth 1: 3x5px nub downward near end of shaft -->
    <rect x="29" y="19.5" width="4" height="5" rx="1" fill="#d4a017"/>

    <!-- Tooth 2: smaller nub slightly inboard -->
    <rect x="24" y="19.5" width="3" height="4" rx="1" fill="#d4a017"/>
  </g>
</svg>
