<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 120" width="60" height="120">
  <!-- Background -->
  <rect width="60" height="120" fill="#0a0a0f"/>

  <!-- Player silhouette: centered at x=30 -->
  <!-- Body: 20x40, centered horizontally at x=20..40, y=60..100 -->
  <rect x="20" y="62" width="20" height="40"
        fill="#111118" stroke="#222230" stroke-width="0.6"/>

  <!-- Head: oval 10x12, centered at (30, 54) -->
  <ellipse cx="30" cy="52" rx="10" ry="12"
           fill="#111118" stroke="#222230" stroke-width="0.6"/>

  <!-- Neck -->
  <rect x="27" y="62" width="6" height="6" fill="#111118"/>

  <!-- Arms -->
  <rect x="12" y="64" width="8" height="3" rx="1"
        fill="#111118" stroke="#222230" stroke-width="0.5"/>
  <rect x="40" y="64" width="8" height="3" rx="1"
        fill="#111118" stroke="#222230" stroke-width="0.5"/>

  <!-- Legs -->
  <rect x="21" y="100" width="7" height="14" rx="1"
        fill="#111118" stroke="#222230" stroke-width="0.5"/>
  <rect x="32" y="100" width="7" height="14" rx="1"
        fill="#111118" stroke="#222230" stroke-width="0.5"/>

  <!-- Subtle white eye dot -->
  <circle cx="30" cy="50" r="1.4" fill="rgba(255,255,255,0.55)"/>
</svg>
