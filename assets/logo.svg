<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Multi-layer red glow for title -->
    <filter id="redGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6"
                    flood-color="#8b0000" flood-opacity="0.90" result="s1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12"
                    flood-color="#cc0000" flood-opacity="0.55" result="s2"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3"
                    flood-color="#000000" flood-opacity="0.80"/>
    </filter>

    <!-- Subtle glow for tagline text -->
    <filter id="tagGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2"
                    flood-color="rgba(255,255,255,0.30)" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Pure black background -->
  <rect width="400" height="120" fill="#000000"/>

  <!-- Title: ECHOES OF WARD 13 — large serif, crimson #8b0000 with red glow -->
  <text x="200" y="56"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42"
        font-weight="bold"
        fill="#8b0000"
        text-anchor="middle"
        letter-spacing="2"
        filter="url(#redGlow)">ECHOES OF WARD 13</text>

  <!-- Horizontal red separator line -->
  <line x1="40" y1="68" x2="360" y2="68"
        stroke="#6b0000" stroke-width="1" opacity="0.75"/>
  <!-- Thinner accent lines flanking the separator -->
  <line x1="40"  y1="66" x2="160" y2="66"
        stroke="#4a0000" stroke-width="0.5" opacity="0.5"/>
  <line x1="240" y1="66" x2="360" y2="66"
        stroke="#4a0000" stroke-width="0.5" opacity="0.5"/>

  <!-- Tagline: monospace white, letter-spaced -->
  <text x="200" y="90"
        font-family="'Courier New', Courier, monospace"
        font-size="14"
        fill="white"
        text-anchor="middle"
        letter-spacing="3"
        opacity="0.82"
        filter="url(#tagGlow)">THE DARK HEARS YOUR HEARTBEAT</text>
</svg>
