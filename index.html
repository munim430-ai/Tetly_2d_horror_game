// ==================== AUDIO ====================
let audioCtx = null;
let ambienceNode = null, ambienceGain = null;
let chaseOsc = null, chaseGain = null, chaseOsc2 = null;
let chaseActive = false;
let heartbeatInterval = null;
let lastFootstep = 0;
let audioReady = false;

function initAudio() {
  if (audioReady) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    ambienceGain = audioCtx.createGain();
    ambienceGain.gain.value = 0.15;
    ambienceGain.connect(audioCtx.destination);
    ambienceNode = audioCtx.createOscillator();
    ambienceNode.type = 'sine';
    ambienceNode.frequency.value = 40;
    ambienceNode.connect(ambienceGain);
    ambienceNode.start();
    // Chase music layer — sawtooth pulse, initially silent
    chaseGain = audioCtx.createGain();
    chaseGain.gain.value = 0;
    chaseGain.connect(audioCtx.destination);
    chaseOsc = audioCtx.createOscillator();
    chaseOsc.type = 'sawtooth';
    chaseOsc.frequency.value = 55;
    chaseOsc.connect(chaseGain);
    chaseOsc.start();
    // Second chase oscillator slightly detuned for tension
    chaseOsc2 = audioCtx.createOscillator();
    chaseOsc2.type = 'sawtooth';
    chaseOsc2.frequency.value = 58;
    chaseOsc2.connect(chaseGain);
    chaseOsc2.start();
    audioReady = true;
  } catch(e) {
    console.warn('Web Audio API not available:', e);
  }
}

function updateChaseMusic() {
  if (!audioCtx || !chaseGain) return;
  const hunting = (entity.state === 'hunt') || (entity2 && entity2.state === 'hunt');
  const allKeys = player.keysCollected >= 3;
  const targetGain = player.hiding ? 0 : hunting ? (allKeys ? 0.22 : 0.14) : 0;
  const current = chaseGain.gain.value;
  // Smooth ramp: attack fast, release slow
  const rate = targetGain > current ? 0.04 : 0.012;
  chaseGain.gain.value = current + (targetGain - current) * rate;
  // Modulate frequency slightly for pulse effect
  if (chaseOsc) chaseOsc.frequency.value = 55 + Math.sin(Date.now() * 0.003) * 4;
  if (chaseOsc2) chaseOsc2.frequency.value = 58 + Math.cos(Date.now() * 0.0025) * 3;
}

function playTone(type, freq, endFreq, duration, vol, startTime) {
  if (!audioCtx) return;
  const t = startTime !== undefined ? startTime : audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (endFreq !== null) osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration + 0.05);
}

function playHeartbeat(bpm) {
  if (!audioCtx) return;
  const interval = 60 / bpm;
  const t = audioCtx.currentTime;
  playTone('sine', 60, 40, 0.08, 0.4, t);
  playTone('sine', 60, 40, 0.08, 0.25, t + 0.12);
  return interval * 1000;
}

function playFootstep() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 200;
  filt.Q.value = 0.5;
  src.buffer = buf;
  g.gain.value = 0.18;
  src.connect(filt);
  filt.connect(g);
  g.connect(audioCtx.destination);
  src.start(t);
}

function playEntityProximity(entityX, playerX) {
  if (!audioCtx) return;
  const dist = Math.abs(entityX - playerX);
  if (dist > 600) return;
  const vol = Math.max(0, (1 - dist / 600)) * 0.12;
  const pan = Math.max(-1, Math.min(1, (entityX - playerX) / 300));
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const panner = audioCtx.createStereoPanner();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(55, t);
  osc.frequency.setValueAtTime(50, t + 0.1);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  panner.pan.value = pan;
  osc.connect(g);
  g.connect(panner);
  panner.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.2);
}

function playEntityScreech() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, t);
  osc.frequency.exponentialRampToValueAtTime(880, t + 0.3);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.45);
}

function playBatteryPickup() {
  if (!audioCtx) return;
  playTone('sine', 880, 1320, 0.15, 0.3);
}

function playKeyPickup() {
  if (!audioCtx) return;
  playTone('triangle', 660, 660, 0.12, 0.25);
  playTone('triangle', 990, 990, 0.12, 0.2, audioCtx.currentTime + 0.1);
}

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BASE_W = 800, BASE_H = 450;
let scale = 1, offX = 0, offY = 0;

function resizeCanvas() {
  const wr = window.innerWidth / BASE_W;
  const hr = window.innerHeight / BASE_H;
  scale = Math.min(wr, hr);
  canvas.width = BASE_W;
  canvas.height = BASE_H;
  canvas.style.width = (BASE_W * scale) + 'px';
  canvas.style.height = (BASE_H * scale) + 'px';
  // Ensure touch buttons are at least 48 physical px
  BTN_W = BTN_H = Math.max(70, Math.ceil(48 / scale));
  BTN_FLASH_X = BASE_W - BTN_W * 2 - 15;
  BTN_HIDE_X  = BASE_W - BTN_W - 10;
  BTN_FLASH_Y = BTN_HIDE_Y = BASE_H - BTN_H - 10;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ==================== INPUT ====================
window.addEventListener('keydown', e => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if ((e.key === 'f' || e.key === 'F') && !keys.f) { keys.f = true; keys.fPressed = true; }
  if ((e.key === 'h' || e.key === 'H') && !keys.h) { keys.h = true; keys.hPressed = true; }
  // Pause
  if (e.key === '?' || e.key === '/') {
    if (state === 'start') { state = 'howToPlay'; return; }
    if (state === 'howToPlay') { state = 'start'; return; }
  }
  if (state === 'howToPlay' && e.key === 'Escape') { state = 'start'; return; }
  if (e.key === 'Escape') {
    if (state === 'playing') { state = 'paused'; return; }
    if (state === 'paused')  { state = 'playing'; return; }
  }
  if (state === 'credits') {
    if (e.key === 'Escape') { state = 'start'; return; }
  }
  if ((e.key === 'c' || e.key === 'C') && (state === 'start' || state === 'paused')) {
    state = 'credits'; return;
  }
  if (state === 'paused') {
    if (e.key === 'r' || e.key === 'R') { state = 'playing'; return; }
    if (e.key === 'n' || e.key === 'N') { loadLevel(currentLevel); resetPlayer(); resetEntity(); camera.x = 0; frameCount = 0; state = 'playing'; return; }
    if (e.key === 'm' || e.key === 'M') { state = 'start'; return; }
  }
  if ((e.key === 'l' || e.key === 'L') && state === 'start') { levelSelectIndex = 0; state = 'levelSelect'; return; }
  if (state === 'levelSelect') {
    if (e.key === 'Escape') { state = 'start'; return; }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      levelSelectIndex = Math.max(0, levelSelectIndex - 1); return;
    }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      levelSelectIndex = Math.min(LEVELS.length - 1, levelSelectIndex + 1); return;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      const maxUnlocked = loadMaxLevel();
      if (levelSelectIndex <= maxUnlocked) {
        initAudio();
        loadLevel(levelSelectIndex);
        resetPlayer(); resetEntity();
        camera.x = 0; frameCount = 0; lastFootstep = 0;
        lastHeartbeatTime = 0; entityProximityTimer = 0;
        state = 'levelIntro'; levelIntroTimer = 0;
      }
      return;
    }
  }
  if ((e.key === ' ' || e.key === 'Enter') && (state === 'start' || state === 'dead' || state === 'win')) {
    startGame();
  }
  if ((e.key === ' ' || e.key === 'Enter') && state === 'levelComplete') {
    advanceLevel();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'f' || e.key === 'F') keys.f = false;
  if (e.key === 'h' || e.key === 'H') keys.h = false;
});

// Touch joystick
const touch = {
  active: false,
  id: null,
  startX: 0, startY: 0,
  curX: 0, curY: 0,
  dx: 0

const btnFlash = { pressed: false };
const btnHide = { pressed: false };
let btnFlashPressedThisFrame = false;
let btnHidePressedThisFrame = false;

function getTouchPos(t) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - rect.left) / scale,
    y: (t.clientY - rect.top) / scale
  };
}

function isInBtn(x, y, bx, by, bw, bh) {
  return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
}

let BTN_W = 70, BTN_H = 70;
let BTN_FLASH_X = BASE_W - 155, BTN_FLASH_Y = BASE_H - 85;
let BTN_HIDE_X  = BASE_W - 80,  BTN_HIDE_Y  = BASE_H - 85;
const JOY_CX = 80, JOY_CY = BASE_H - 80, JOY_R = 60;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'credits' || state === 'howToPlay') { state = 'start'; return; }
  if (state === 'start') {
    // Check ? button tap
    const tp0 = getTouchPos(e.changedTouches[0]);
    if (tp0.x < 140 && tp0.y > BASE_H - 26) { state = 'howToPlay'; return; }
  }
  if (state === 'start' || state === 'dead' || state === 'win') { startGame(); return; }
  if (state === 'levelComplete') { advanceLevel(); return; }
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const p = getTouchPos(t);
    if (isInBtn(p.x, p.y, BTN_FLASH_X, BTN_FLASH_Y, BTN_W, BTN_H)) {
      btnFlash.pressed = true; btnFlashPressedThisFrame = true;
    } else if (isInBtn(p.x, p.y, BTN_HIDE_X, BTN_HIDE_Y, BTN_W, BTN_H)) {
      btnHide.pressed = true; btnHidePressedThisFrame = true;
    } else if (!touch.active && p.x < BASE_W / 2) {
      touch.active = true;
      touch.id = t.identifier;
      touch.startX = p.x; touch.startY = p.y;
      touch.curX = p.x; touch.curY = p.y;
      touch.dx = 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touch.id) {
      const p = getTouchPos(t);
      touch.curX = p.x; touch.curY = p.y;
      touch.dx = Math.max(-1, Math.min(1, (touch.curX - touch.startX) / JOY_R));
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touch.id) {
      touch.active = false; touch.id = null; touch.dx = 0;
    }
    const p = getTouchPos(t);
    if (isInBtn(p.x, p.y, BTN_FLASH_X, BTN_FLASH_Y, BTN_W, BTN_H)) btnFlash.pressed = false;
    if (isInBtn(p.x, p.y, BTN_HIDE_X, BTN_HIDE_Y, BTN_W, BTN_H)) btnHide.pressed = false;
  }
}, { passive: false });

canvas.addEventListener('click', e => {
  if (state === 'start' || state === 'dead' || state === 'win') startGame();
  if (state === 'levelComplete') advanceLevel();
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

// ==================== LEVEL DEFINITION (runtime arrays, populated by loadLevel) ====================
let obstacles = [];
let lockers = [];
let batteries = [];
let keyItems = [];
let exitDoor = {};
let bloodSmears = [];

function loadLevel(index) {
  currentLevel = index;
  levelData = LEVELS[index];

  obstacles.length = 0;
  levelData.obstacles.forEach(o => obstacles.push(o));

  lockers.length = 0;
  levelData.lockers.forEach(l => lockers.push({ ...l, cooldown: 0 }));

  batteries.length = 0;
  levelData.batteries.forEach(b => batteries.push({ x: b.x, y: GROUND_Y - 20, collected: false }));

  keyItems.length = 0;
  levelData.keyItems.forEach(k => keyItems.push({ x: k.x, y: GROUND_Y - 25, collected: false }));

  Object.assign(exitDoor, levelData.exitDoor);

  bloodSmears.length = 0;
  levelData.bloodSmears.forEach((s, i) => bloodSmears.push({ x: s, y: GROUND_Y - 70 - (i % 2) * 20, w: 50 + i * 5, type: i % 2 }));
}

// ==================== PLAYER ====================
let player = {};
function resetPlayer() {
  player = {
    x: 80, y: GROUND_Y - PLAYER_H,
    vx: 0, vy: 0,
    onGround: true,
    speed: 2.5,
    runSpeed: 2.5,
    flashlight: true,
    battery: 100,
    fear: 0,
    keysCollected: 0,
    hiding: false,
    hideTimer: 0,
    nearLocker: false,
    lockerIndex: -1,
    shakeX: 0, shakeY: 0,
    dead: false,
    won: false,
  };
}

function updatePlayer(dt) {
  if (player.dead || player.won) return;

  // Consume flash presses
  if (keys.fPressed || btnFlashPressedThisFrame) {
    player.flashlight = !player.flashlight;
    keys.fPressed = false;
    btnFlashPressedThisFrame = false;
  }

  // Check hide press
  if ((keys.hPressed || btnHidePressedThisFrame) && !player.hiding) {
    keys.hPressed = false;
    btnHidePressedThisFrame = false;
    if (player.nearLocker && player.lockerIndex >= 0) {
      const lk = lockers[player.lockerIndex];
      if (lk.cooldown <= 0) {
        player.hiding = true;
        player.hideTimer = 5000;
        lk.cooldown = 10000;
      }
    }
  } else {
    keys.hPressed = false;
    btnHidePressedThisFrame = false;
  }

  if (player.hiding) {
    player.hideTimer -= dt;
    if (player.fear > 0) player.fear = Math.max(0, player.fear - 0.08 * (dt / 16.67));
    if (player.hideTimer <= 0) {
      player.hiding = false;
      player.hideTimer = 0;
    }
    return;
  }

  // Movement
  let moving = false;
  let inputDx = 0;
  if (keys.left) inputDx -= 1;
  if (keys.right) inputDx += 1;
  if (touch.active) inputDx += touch.dx;
  inputDx = Math.max(-1, Math.min(1, inputDx));

  if (Math.abs(inputDx) > 0.05) {
    moving = true;
    player.vx = inputDx * player.runSpeed;
  } else {
    player.vx *= 0.8;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  player.x += player.vx;
  player.x = Math.max(0, Math.min(WORLD_W - PLAYER_W, player.x));

  // Battery drain
  if (player.flashlight) {
    const drainRate = levelData.batteryDrainRate !== undefined ? levelData.batteryDrainRate : 0.08;
    player.battery = Math.max(0, player.battery - drainRate * (dt / 16.67));
    if (player.battery <= 0) player.flashlight = false;
  }

  // Fear update
  const lit = player.flashlight;
  const entityDist = Math.abs(entity.x - player.x);
  let fearDelta = 0;
  if (!lit) fearDelta += 0.02 * (dt / 16.67);
  if (entityDist < 300) fearDelta += 0.1 * (dt / 16.67) * (1 - entityDist / 300);
  else if (!lit) fearDelta += 0.01 * (dt / 16.67);
  if (player.hiding) fearDelta = -0.05 * (dt / 16.67);
  player.fear = Math.max(0, Math.min(100, player.fear + fearDelta));
  // Passive fear decay: lights on, entity far away, not hiding
  if (player.flashlight && entityDist > 500 && !player.hiding) {
    player.fear = Math.max(0, player.fear - 0.015 * (dt / 16.67));
  }

  // Passive fear decay when flashlight on and entity is distant
  const entityDist2 = Math.abs(entity.x - player.x);
  if (player.flashlight && entityDist2 > 500 && !player.hiding) {
    player.fear = Math.max(0, player.fear - 0.015 * (dt / 16.67));
  }

  // Fear screen shake
  if (player.fear > 80) {
    player.shakeX = (Math.random() - 0.5) * 4 * ((player.fear - 80) / 20);
    player.shakeY = (Math.random() - 0.5) * 4 * ((player.fear - 80) / 20);
  } else {
    player.shakeX = 0; player.shakeY = 0;
  }

  // Footsteps
  if (moving) {
    frameCount++;
    if (frameCount - lastFootstep > 20) {
      playFootstep();
      lastFootstep = frameCount;
    }
  }

  // Locker cooldowns
  for (const lk of lockers) {
    if (lk.cooldown > 0) lk.cooldown -= dt;
  }

  // Check near locker
  player.nearLocker = false;
  player.lockerIndex = -1;
  for (let i = 0; i < lockers.length; i++) {
    const lk = lockers[i];
    if (Math.abs(player.x + PLAYER_W / 2 - (lk.x + lk.w / 2)) < 80) {
      player.nearLocker = true;
      player.lockerIndex = i;
      break;
    }
  }

  // Collect batteries
  for (const bat of batteries) {
    if (!bat.collected && Math.abs(player.x - bat.x) < 20 && Math.abs(player.y - bat.y) < 30) {
      bat.collected = true;
      player.battery = Math.min(100, player.battery + 30);
      playBatteryPickup();
    }
  }

  // Collect keys
  for (const ki of keyItems) {
    if (!ki.collected && Math.abs(player.x - ki.x) < 25 && Math.abs(player.y - ki.y) < 35) {
      ki.collected = true;
      player.keysCollected++;
      playKeyPickup();
    }
  }

  // Check exit
  if (player.keysCollected >= 3) {
    const px = player.x + PLAYER_W / 2;
    if (px >= exitDoor.x && px <= exitDoor.x + exitDoor.w + 10) {
      player.won = true;
      if (currentLevel < 4) {
        state = 'levelComplete';
        frameCount = 0;
      } else {
        state = 'win';
      }
    }
  }

  // Obstacle collision (simple horizontal block)
  for (const obs of obstacles) {
    if (obs.type === 'wall' || obs.type === 'wallchunk' || obs.type === 'bars') {
      const px1 = player.x, px2 = player.x + PLAYER_W;
      const ox1 = obs.x, ox2 = obs.x + obs.w;
      const py2 = player.y + PLAYER_H;
      const oy1 = obs.y;
      if (px2 > ox1 && px1 < ox2 && py2 > oy1) {
        if (player.vx > 0) player.x = ox1 - PLAYER_W;
        else if (player.vx < 0) player.x = ox2;
      }
    }
  }
}

// ==================== ENTITY ====================
let entity = {};
let entity2 = null;
function resetEntity() {
  entity = {
    x: levelData.entityStart,
    y: GROUND_Y - ENTITY_H,
    vx: 1,
    state: 'patrol',
    patrolLeft: levelData.entityPatrolLeft,
    patrolRight: levelData.entityPatrolRight,
    sway: 0,
    swayDir: 1,
    attackTimer: 0,
    huntCooldown: 0,
  };
  if (currentLevel === 4) {
    entity2 = {
      x: 400,
      y: GROUND_Y - ENTITY_H,
      vx: -1,
      state: 'patrol',
      patrolLeft: 200,
      patrolRight: 2200,
      sway: 0,
      swayDir: 1,
      huntCooldown: 0,
    };
  } else {
    entity2 = null;
  }
}

function updateEntity(dt) {
  if (player.dead || player.won) return;

  const allKeysCollected = player.keysCollected >= 3;
  const speed = allKeysCollected ? levelData.speedFinal : (entity.state === 'hunt' ? levelData.speedHunt : levelData.speedPatrol);

  // State machine
  if (allKeysCollected) {
    entity.state = 'hunt';
  } else {
    // Detect player
    let attracted = false;
    const dist = Math.abs(entity.x - player.x);

    // Flashlight hitting entity
    if (player.flashlight && !player.hiding) {
      const flashDir = player.vx >= 0 ? 1 : -1;
      const entityDir = entity.x > player.x ? 1 : -1;
      if (flashDir === entityDir && dist < 350) attracted = true;
    }

    // Running footsteps
    if (Math.abs(player.vx) > 2.0 && dist < 400 && !player.hiding) attracted = true;

    // Heartbeat at high fear
    if (player.fear > 60 && dist < 500 && !player.hiding) attracted = true;

    if (attracted) {
      entity.state = 'hunt';
      entity.huntCooldown = 3000; // 3-second memory
    } else if (entity.state === 'hunt') {
      entity.huntCooldown -= dt;
      if (entity.huntCooldown <= 0) {
        entity.state = 'patrol';
        entity.huntCooldown = 0;
      }
    }
  }

  // Movement
  if (entity.state === 'patrol') {
    entity.x += entity.vx * speed;
    if (entity.x <= entity.patrolLeft) { entity.x = entity.patrolLeft; entity.vx = 1; }
    if (entity.x >= entity.patrolRight) { entity.x = entity.patrolRight; entity.vx = -1; }
  } else if (entity.state === 'hunt') {
    if (!player.hiding) {
      const dir = player.x > entity.x ? 1 : -1;
      entity.x += dir * speed;
      entity.vx = dir;
    }
  }

  // Sway animation
  entity.sway += entity.swayDir * 0.03 * (dt / 16.67);
  if (Math.abs(entity.sway) > 1) entity.swayDir *= -1;

  // Entity obstacle collision — same walls that block the player
  for (const obs of obstacles) {
    if (obs.type === 'wall' || obs.type === 'wallchunk' || obs.type === 'bars') {
      const ex1 = entity.x, ex2 = entity.x + ENTITY_W;
      const ox1 = obs.x, ox2 = obs.x + obs.w;
      const ey2 = entity.y + ENTITY_H;
      if (ex2 > ox1 && ex1 < ox2 && ey2 > obs.y) {
        if (entity.vx > 0) { entity.x = ox1 - ENTITY_W; entity.vx = -1; }
        else if (entity.vx < 0) { entity.x = ox2; entity.vx = 1; }
        // If hunting, stop clipping — entity loses player behind a wall
        if (entity.state === 'hunt') entity.state = 'patrol';
      }
    }
  }

  // Check attack
  if (!player.hiding) {
    const dist = Math.abs(entity.x + ENTITY_W / 2 - (player.x + PLAYER_W / 2));
    if (dist < 25) {
      playEntityScreech();
      player.dead = true;
      state = 'dead';
    }
  }

  // Entity proximity sound (every 30 frames)
  entityProximityTimer++;
  if (entityProximityTimer >= 30) {
    entityProximityTimer = 0;
    playEntityProximity(entity.x, player.x);
  }

  // Update entity2 on level 5
  if (currentLevel === 4 && entity2) {
    updateEntity2(dt);
  }
}

function updateEntity2(dt) {
  if (player.dead || player.won) return;
  const allKeysCollected = player.keysCollected >= 3;
  const speed = allKeysCollected ? levelData.speedFinal : (entity2.state === 'hunt' ? levelData.speedHunt : levelData.speedPatrol);

  if (allKeysCollected) {

    if (player.flashlight && !player.hiding) {

      const entityDir = entity2.x > player.x ? 1 : -1;
      if (flashDir === entityDir && dist < 350) attracted = true;
    }
    if (Math.abs(player.vx) > 2.0 && dist < 400 && !player.hiding) attracted = true;
    if (player.fear > 60 && dist < 500 && !player.hiding) attracted = true;
    if (attracted) {
      entity2.state = 'hunt';
      entity2.huntCooldown = 3000; // 3-second memory
    } else if (entity2.state === 'hunt') {
      entity2.huntCooldown -= dt;
      if (entity2.huntCooldown <= 0) {
        entity2.state = 'patrol';
        entity2.huntCooldown = 0;
      }
    }
  }

  // Movement
  if (entity2.state === 'patrol') {

    if (entity2.x <= entity2.patrolLeft) { entity2.x = entity2.patrolLeft; entity2.vx = 1; }
    if (entity2.x >= entity2.patrolRight) { entity2.x = entity2.patrolRight; entity2.vx = -1; }
  } else if (entity2.state === 'hunt') {
    if (!player.hiding) {
      const dir = player.x > entity2.x ? 1 : -1;
      entity2.x += dir * speed;
      entity2.vx = dir;
    }
  }

  // Sway animation
  entity2.sway += entity2.swayDir * 0.03 * (dt / 16.67);
  if (Math.abs(entity2.sway) > 1) entity2.swayDir *= -1;

  // Entity2 obstacle collision — same walls that block the player
  for (const obs of obstacles) {
    if (obs.type === 'wall' || obs.type === 'wallchunk' || obs.type === 'bars') {
      const ex1 = entity2.x, ex2 = entity2.x + ENTITY_W;
      const ox1 = obs.x, ox2 = obs.x + obs.w;
      const ey2 = entity2.y + ENTITY_H;
      if (ex2 > ox1 && ex1 < ox2 && ey2 > obs.y) {
        if (entity2.vx > 0) { entity2.x = ox1 - ENTITY_W; entity2.vx = -1; }
        else if (entity2.vx < 0) { entity2.x = ox2; entity2.vx = 1; }
        // If hunting, stop clipping — entity loses player behind a wall
        if (entity2.state === 'hunt') entity2.state = 'patrol';
      }
    }
  }

  // Check attack
  if (!player.hiding) {
    const dist = Math.abs(entity2.x + ENTITY_W / 2 - (player.x + PLAYER_W / 2));
    if (dist < 25) {
      playEntityScreech();
      player.dead = true;
      state = 'dead';
    }
  }
}

// ==================== CAMERA ====================
let camera = { x: 0 };
function updateCamera() {
  const target = player.x - BASE_W / 2 + PLAYER_W / 2;
  const clamped = Math.max(0, Math.min(WORLD_W - BASE_W, target));
  camera.x += (clamped - camera.x) * 0.1;
}

// ==================== RENDER HELPERS ====================
function wx(worldX) { return worldX - camera.x; }

function drawBackground() {
  const bg    = (levelData && levelData.bgColor)    ? levelData.bgColor    : '#0a0a0f';
  const floor = (levelData && levelData.floorColor) ? levelData.floorColor : '#1a1a22';

  // Base fill
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  if (currentLevel === 0) {
    // Level 1 — The Morgue: blue-grey hospital interior
    ctx.fillStyle = '#0d0d16';
    ctx.fillRect(0, 0, BASE_W, 75);                        // ceiling strip
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 75, BASE_W, GROUND_Y - 75);            // wall
    ctx.fillStyle = floor;
    ctx.fillRect(0, GROUND_Y, BASE_W, BASE_H - GROUND_Y);
    ctx.fillStyle = '#22222e';
    ctx.fillRect(0, GROUND_Y, BASE_W, 3);                  // floor edge
    // Ceiling pipe brackets every 180px
    for (let xi = 0; xi < WORLD_W; xi += 180) {
      const sx = wx(xi); if (sx < -10 || sx > BASE_W + 10) continue;
      ctx.fillStyle = '#111119'; ctx.fillRect(sx, 18, 8, 57);
    }
    // Wall cracks
    ctx.strokeStyle = '#111118'; ctx.lineWidth = 1;
    for (let xi = 0; xi < WORLD_W; xi += 250) {
      const sx = wx(xi); if (sx < -50 || sx > BASE_W + 50) continue;
      ctx.beginPath(); ctx.moveTo(sx+10,100); ctx.lineTo(sx+25,132); ctx.lineTo(sx+15,162); ctx.stroke();
    }

  } else if (currentLevel === 1) {
    // Level 2 — The Basement: dark green, low ceiling, industrial pipes
    ctx.fillStyle = '#040a04';
    ctx.fillRect(0, 0, BASE_W, 55);                        // low ceiling
    ctx.fillStyle = '#080e08';
    ctx.fillRect(0, 55, BASE_W, GROUND_Y - 55);
    ctx.fillStyle = floor;
    ctx.fillRect(0, GROUND_Y, BASE_W, BASE_H - GROUND_Y);
    ctx.fillStyle = '#161e16'; ctx.fillRect(0, GROUND_Y, BASE_W, 3);
    // Horizontal pipes running across ceiling
    ctx.strokeStyle = '#0f1a0f'; ctx.lineWidth = 6;
    for (let yi = 15; yi < 50; yi += 18) {
      ctx.beginPath(); ctx.moveTo(0, yi); ctx.lineTo(BASE_W, yi); ctx.stroke();
    }
    // Vertical pipe drops from ceiling every 200px
    ctx.lineWidth = 4;
    for (let xi = 0; xi < WORLD_W; xi += 200) {
      const sx = wx(xi); if (sx < -5 || sx > BASE_W + 5) continue;
      ctx.strokeStyle = '#0e180e';
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, 55 + (xi % 60)); ctx.stroke();
      // drip stain on floor
      ctx.fillStyle = '#0a120a';
      ctx.beginPath(); ctx.ellipse(sx, GROUND_Y + 4, 6, 3, 0, 0, Math.PI*2); ctx.fill();
    }
    // Steam vent marks on wall
    ctx.fillStyle = '#0d140d';
    for (let xi = 100; xi < WORLD_W; xi += 350) {
      const sx = wx(xi); if (sx < -20 || sx > BASE_W + 20) continue;
      ctx.fillRect(sx, 130, 18, 8);
    }

  } else if (currentLevel === 2) {
    // Level 3 — Patient Corridors: purple-grey, cell-door marks on walls
    ctx.fillStyle = '#0c0a14';
    ctx.fillRect(0, 0, BASE_W, 70);
    ctx.fillStyle = '#100e1a';
    ctx.fillRect(0, 70, BASE_W, GROUND_Y - 70);
    ctx.fillStyle = floor;
    ctx.fillRect(0, GROUND_Y, BASE_W, BASE_H - GROUND_Y);
    ctx.fillStyle = '#1e1c28'; ctx.fillRect(0, GROUND_Y, BASE_W, 3);
    // Recessed door-frame marks every 280px on upper wall
    ctx.strokeStyle = '#141220'; ctx.lineWidth = 1.5;
    for (let xi = 60; xi < WORLD_W; xi += 280) {
      const sx = wx(xi); if (sx < -30 || sx > BASE_W + 30) continue;
      ctx.strokeRect(sx, 80, 28, 90);          // door frame
      ctx.beginPath(); ctx.arc(sx+14, 160, 3, 0, Math.PI*2); ctx.stroke(); // knob
    }
    // Ceiling fluorescent light strips
    ctx.fillStyle = '#16142020';
    for (let xi = 0; xi < WORLD_W; xi += 240) {
      const sx = wx(xi); if (sx < -10 || sx > BASE_W + 10) continue;
      ctx.fillStyle = '#1a182a'; ctx.fillRect(sx, 5, 60, 10);
      // dim glow under light
      const g = ctx.createLinearGradient(sx+30, 15, sx+30, 60);
      g.addColorStop(0, 'rgba(120,100,200,0.04)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(sx, 15, 60, 45);
    }
    // Wall number stencils
    ctx.fillStyle = '#1c1a26'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'left';
    for (let xi = 120; xi < WORLD_W; xi += 280) {
      const sx = wx(xi); if (sx < 0 || sx > BASE_W) continue;
      ctx.fillText(String(Math.floor(xi/100)).padStart(2,'0'), sx, 175);
    }

  } else if (currentLevel === 3) {
    // Level 4 — Operating Theatre: near-black, surgical lights, tile floor
    ctx.fillStyle = '#060606';
    ctx.fillRect(0, 0, BASE_W, 65);
    ctx.fillStyle = '#090909';
    ctx.fillRect(0, 65, BASE_W, GROUND_Y - 65);
    ctx.fillStyle = floor;
    ctx.fillRect(0, GROUND_Y, BASE_W, BASE_H - GROUND_Y);
    ctx.fillStyle = '#181818'; ctx.fillRect(0, GROUND_Y, BASE_W, 3);
    // Floor tile grid
    ctx.strokeStyle = '#111111'; ctx.lineWidth = 0.5;
    for (let xi = 0; xi < WORLD_W; xi += 60) {
      const sx = wx(xi); if (sx < 0 || sx > BASE_W) continue;
      ctx.beginPath(); ctx.moveTo(sx, GROUND_Y); ctx.lineTo(sx, BASE_H); ctx.stroke();
    }
    // Overhead surgical lights hanging from ceiling every 320px
    for (let xi = 80; xi < WORLD_W; xi += 320) {
      const sx = wx(xi); if (sx < -40 || sx > BASE_W + 40) continue;
      ctx.fillStyle = '#111111';
      ctx.fillRect(sx - 2, 0, 4, 45);           // cord
      ctx.beginPath(); ctx.arc(sx, 50, 18, 0, Math.PI*2);
      ctx.fillStyle = '#131313'; ctx.fill();
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1; ctx.stroke();
      // faint cone under light
      const cone = ctx.createRadialGradient(sx, 50, 5, sx, 50, 80);
      cone.addColorStop(0, 'rgba(200,220,180,0.05)');
      cone.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = cone;
      ctx.beginPath(); ctx.moveTo(sx-80,GROUND_Y); ctx.lineTo(sx+80,GROUND_Y); ctx.lineTo(sx+20,50); ctx.lineTo(sx-20,50); ctx.closePath(); ctx.fill();
    }
    // Ceiling air vent marks
    ctx.fillStyle = '#0e0e0e';
    for (let xi = 200; xi < WORLD_W; xi += 280) {
      const sx = wx(xi); if (sx < 0 || sx > BASE_W) continue;
      ctx.fillRect(sx, 8, 30, 20);
      ctx.strokeStyle = '#141414'; ctx.lineWidth = 0.5;
      for (let vi = 0; vi < 5; vi++) { ctx.beginPath(); ctx.moveTo(sx, 10+vi*3); ctx.lineTo(sx+30, 10+vi*3); ctx.stroke(); }
    }

  } else {
    // Level 5 — The Rooftop: outdoor night sky, no ceiling, stars, distant skyline
    // Night sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#02020a');
    sky.addColorStop(0.6, '#050510');
    sky.addColorStop(1, '#08081a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, BASE_W, GROUND_Y);
    // Concrete/gravel floor
    ctx.fillStyle = floor; ctx.fillRect(0, GROUND_Y, BASE_W, BASE_H - GROUND_Y);
    ctx.fillStyle = '#16161e'; ctx.fillRect(0, GROUND_Y, BASE_W, 3);
    // Stars (deterministic)
    ctx.fillStyle = 'rgba(200,210,255,0.5)';
    for (let i = 0; i < 60; i++) {
      const sx = ((i * 137 + camera.x * 0.02) % BASE_W);
      const sy = (i * 97) % (GROUND_Y - 30);
      const r = (i % 3 === 0) ? 1.2 : 0.7;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    }
    // Distant city skyline silhouette
    ctx.fillStyle = '#04040e';
    const buildings = [50,90,60,110,70,130,55,80,100,65,120,75,45,95];
    let bx = 0;
    for (const bh of buildings) {
      const bw = 35 + (bx % 20);
      ctx.fillRect(bx, GROUND_Y - bh - 60, bw, bh);
      bx += bw + 5;
    }
    // Moon
    ctx.fillStyle = 'rgba(220,210,180,0.12)';
    ctx.beginPath(); ctx.arc(BASE_W - 60 - (camera.x * 0.01 % 30), 55, 22, 0, Math.PI*2); ctx.fill();
    // Rooftop ledge/parapet at ground level
    ctx.fillStyle = '#0e0e18';
    ctx.fillRect(0, GROUND_Y - 8, BASE_W, 8);
    // Roof vents/AC units
    ctx.fillStyle = '#0c0c16';
    for (let xi = 300; xi < WORLD_W; xi += 600) {
      const sx = wx(xi); if (sx < -30 || sx > BASE_W + 30) continue;
      ctx.fillRect(sx, GROUND_Y - 30, 50, 22);
      ctx.strokeStyle = '#141420'; ctx.lineWidth = 1;
      ctx.strokeRect(sx, GROUND_Y - 30, 50, 22);
    }
  }
}

function drawBloodSmear(smear) {
  const sx = wx(smear.x);
  if (sx < -100 || sx > BASE_W + 100) return;
  ctx.save();
  ctx.translate(sx, smear.y);
  ctx.strokeStyle = '#3a0808';
  ctx.lineWidth = 3;
  if (smear.type === 0) {
    ctx.beginPath();
    ctx.arc(0, 0, smear.w / 3, 0, Math.PI * 1.5);
    ctx.stroke();
    ctx.fillStyle = '#2a0606';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.ellipse(i * 8 - 10, 5, 3, 2, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(-smear.w / 2, 0);
    ctx.lineTo(smear.w / 2, -15);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#2a0606';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.ellipse(-smear.w / 2 + i * 10, 4 + Math.sin(i) * 3, 2, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawObstacle(obs) {
  const sx = wx(obs.x);
  if (sx < -100 || sx > BASE_W + 100) return;
  ctx.save();
  ctx.translate(sx, obs.y);

  if (obs.type === 'wall' || obs.type === 'wallchunk' || obs.type === 'collapsed') {
    ctx.fillStyle = '#161620';
    ctx.fillRect(0, 0, obs.w, obs.h);
    ctx.strokeStyle = '#222230';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 0, obs.w, obs.h);
    // Brick pattern
    ctx.strokeStyle = '#1a1a28';
    for (let ry = 0; ry < obs.h; ry += 12) {
      ctx.beginPath();
      ctx.moveTo(0, ry); ctx.lineTo(obs.w, ry);
      ctx.stroke();
    }
  } else if (obs.type === 'bars') {
    ctx.strokeStyle = '#1e1e2a';
    ctx.lineWidth = 3;
    for (let bx = 0; bx <= obs.w; bx += 6) {
      ctx.beginPath();
      ctx.moveTo(bx, 0); ctx.lineTo(bx, obs.h);
      ctx.stroke();
    }
    ctx.strokeStyle = '#222232';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, obs.h / 2); ctx.lineTo(obs.w, obs.h / 2);
    ctx.stroke();
  } else if (obs.type === 'bed') {
    ctx.fillStyle = '#141418';
    ctx.fillRect(0, 0, obs.w, obs.h);
    ctx.fillStyle = '#1a1a20';
    ctx.fillRect(2, 2, obs.w - 4, obs.h / 2);
    ctx.fillStyle = '#0d0d12';
    ctx.fillRect(obs.w - 8, -8, 8, obs.h + 8);
    ctx.strokeStyle = '#222228';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 0, obs.w, obs.h);
  } else if (obs.type === 'table') {
    ctx.fillStyle = '#151518';
    ctx.fillRect(0, 0, obs.w, obs.h - 5);
    ctx.fillStyle = '#111114';
    ctx.fillRect(4, obs.h - 5, 6, 5);
    ctx.fillRect(obs.w - 10, obs.h - 5, 6, 5);
    ctx.strokeStyle = '#202025';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 0, obs.w, obs.h - 5);
  } else if (obs.type === 'wheelchair') {
    // Wheel
    ctx.strokeStyle = '#1a1a22';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(obs.w / 2, obs.h - 8, 8, 0, Math.PI * 2);
    ctx.stroke();
    // Body
    ctx.fillStyle = '#131318';
    ctx.fillRect(4, 0, obs.w - 8, obs.h - 10);
    // Handle
    ctx.strokeStyle = '#181820';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -10); ctx.lineTo(obs.w, -10); ctx.lineTo(obs.w, 0);
    ctx.stroke();
  } else if (obs.type === 'debris') {
    ctx.fillStyle = '#131318';
    ctx.fillRect(0, 5, obs.w, obs.h - 5);
    // Rubble on top
    for (let di = 0; di < 6; di++) {
      ctx.fillStyle = di % 2 === 0 ? '#161620' : '#111115';
      ctx.save();
      ctx.translate(di * 12 + 4, 0);
      ctx.rotate(di * 0.5);
      ctx.fillRect(0, -4, 10, 8);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawLocker(lk) {
  const sx = wx(lk.x);
  if (sx < -50 || sx > BASE_W + 50) return;
  ctx.save();
  ctx.translate(sx, lk.y);
  ctx.fillStyle = '#151520';
  ctx.fillRect(0, 0, lk.w, lk.h);
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, lk.w, lk.h);
  ctx.strokeRect(2, 2, lk.w - 4, lk.h - 4);
  // Handle
  ctx.fillStyle = '#333345';
  ctx.fillRect(lk.w - 6, lk.h / 2 - 4, 4, 8);
  // Highlight if nearby and cooldown ready
  const lkIdx = lockers.indexOf(lk);
  if (player.nearLocker && player.lockerIndex === lkIdx && lk.cooldown <= 0 && !player.hiding) {
    ctx.strokeStyle = '#44885588';
    ctx.lineWidth = 2;
    ctx.strokeRect(-2, -2, lk.w + 4, lk.h + 4);
  }
  ctx.restore();
}

function drawBattery(bat) {
  if (bat.collected) return;
  const sx = wx(bat.x);
  if (sx < -30 || sx > BASE_W + 30) return;
  const pulse = 0.7 + Math.sin(frameCount * 0.05) * 0.3;
  ctx.save();
  ctx.translate(sx, bat.y);
  ctx.strokeStyle = `rgba(80, 200, 80, ${pulse})`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, 16, 10);
  ctx.fillStyle = '#111';
  ctx.fillRect(1, 1, 14, 8);
  const fillW = 10;
  ctx.fillStyle = `rgba(60, 180, 60, ${pulse})`;
  ctx.fillRect(2, 2, fillW, 6);
  // Cap
  ctx.fillStyle = `rgba(60, 180, 60, ${pulse})`;
  ctx.fillRect(16, 3, 3, 4);
  ctx.restore();
}

function drawKey(ki) {
  if (ki.collected) return;
  const sx = wx(ki.x);
  if (sx < -30 || sx > BASE_W + 30) return;
  const bob = Math.sin(frameCount * 0.06) * 3;
  const glow = 0.6 + Math.sin(frameCount * 0.05) * 0.4;
  ctx.save();
  ctx.translate(sx, ki.y + bob);
  // Glow
  const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
  grad.addColorStop(0, `rgba(220, 120, 20, ${glow * 0.7})`);
  grad.addColorStop(1, 'rgba(180, 60, 0, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.fill();
  // Pentagon
  ctx.fillStyle = `rgba(200, 140, 20, ${glow})`;
  ctx.strokeStyle = `rgba(255, 180, 40, ${glow})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
    const r = 7;
    if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawExitDoor() {
  const sx = wx(exitDoor.x);
  if (sx < -50 || sx > BASE_W + 50) return;
  const unlocked = player.keysCollected >= 3;
  ctx.save();
  ctx.translate(sx, exitDoor.y);
  ctx.fillStyle = unlocked ? '#1a2a1a' : '#1a1a22';
  ctx.fillRect(0, 0, exitDoor.w, exitDoor.h);
  ctx.strokeStyle = unlocked ? '#40a840' : '#2a2a3a';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, exitDoor.w, exitDoor.h);
  // Door handle
  ctx.fillStyle = unlocked ? '#50c050' : '#333';
  ctx.beginPath();
  ctx.arc(exitDoor.w - 8, exitDoor.h / 2, 4, 0, Math.PI * 2);
  ctx.fill();
  if (unlocked) {
    const glow = ctx.createRadialGradient(exitDoor.w / 2, exitDoor.h / 2, 0, exitDoor.w / 2, exitDoor.h / 2, 40);
    glow.addColorStop(0, 'rgba(40, 160, 40, 0.3)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(-20, -20, exitDoor.w + 40, exitDoor.h + 40);
    // Text
    ctx.fillStyle = 'rgba(80, 200, 80, 0.8)';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', exitDoor.w / 2, -6);
  }
  ctx.restore();
}

function drawPlayer() {
  if (player.hiding) return;
  const sx = wx(player.x) + player.shakeX;
  const sy = player.y + player.shakeY;
  ctx.save();
  ctx.translate(sx, sy);
  // Body silhouette
  ctx.fillStyle = '#0a0a0d';
  ctx.fillRect(3, 10, PLAYER_W - 6, PLAYER_H - 10);
  // Head
  ctx.beginPath();
  ctx.ellipse(PLAYER_W / 2, 6, 8, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  // Slight outline
  ctx.strokeStyle = '#1a1a22';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(3, 10, PLAYER_W - 6, PLAYER_H - 10);
  ctx.restore();
}

function drawEntity() {
  const sx = wx(entity.x);
  if (sx < -50 || sx > BASE_W + 50) return;
  const sway = Math.sin(entity.sway) * 3;
  ctx.save();
  ctx.translate(sx + sway, entity.y);
  // Main body
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 10, ENTITY_W, ENTITY_H - 10);
  // Head - elongated
  ctx.beginPath();
  ctx.ellipse(ENTITY_W / 2, 5, 9, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  // Subtle outline
  ctx.strokeStyle = '#1e1e25';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 10, ENTITY_W, ENTITY_H - 10);
  ctx.strokeStyle = '#1a1a22';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.ellipse(ENTITY_W / 2, 5, 9, 12, 0, 0, Math.PI * 2);
  ctx.stroke();
  // Arms dangling
  const armSway = Math.sin(entity.sway * 1.5) * 5;
  ctx.strokeStyle = '#0c0c0f';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 20); ctx.lineTo(-10, 35 + armSway);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ENTITY_W, 20); ctx.lineTo(ENTITY_W + 10, 35 - armSway);
  ctx.stroke();
  ctx.restore();
}

function drawEntity2() {

function applyFlashlightMask() {
  if (!player.flashlight || player.hiding) return;
  const sx = wx(player.x) + PLAYER_W / 2 + player.shakeX;
  const sy = player.y + PLAYER_H / 2 + player.shakeY;
  const facingRight = player.vx >= 0;
  const dir = facingRight ? 1 : -1;
  const coneLen = 320;
  const coneAngle = 0.55;

  // Build cone polygon
  const cx = sx + dir * 5;
  const cy = sy;
  const baseAngle = facingRight ? 0 : Math.PI;

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';

  // Draw darkness overlay first
  ctx.fillStyle = 'rgba(5, 5, 10, 0.97)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // Cut out the flashlight cone
  ctx.globalCompositeOperation = 'destination-out';
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coneLen);
  grad.addColorStop(0, 'rgba(0,0,0,1)');
  grad.addColorStop(0.7, 'rgba(0,0,0,0.9)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  const spread = coneAngle;
  const steps = 16;
  for (let i = 0; i <= steps; i++) {
    const a = baseAngle - spread + (2 * spread * i / steps);
    ctx.lineTo(cx + Math.cos(a) * coneLen, cy + Math.sin(a) * coneLen);
  }
  ctx.closePath();
  ctx.fill();

  // Small ambient glow around player
  ctx.globalCompositeOperation = 'destination-out';
  const nearGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
  nearGlow.addColorStop(0, 'rgba(0,0,0,0.6)');
  nearGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = nearGlow;
  ctx.beginPath();
  ctx.arc(cx, cy, 50, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function applyDarknessOverlay() {
  if (player.flashlight && !player.hiding) return;
  ctx.fillStyle = 'rgba(5, 5, 10, 0.97)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
}

let _noiseCanvas = null;
function _buildNoise() {
  _noiseCanvas = document.createElement('canvas');
  _noiseCanvas.width = 256; _noiseCanvas.height = 256;
  const nc = _noiseCanvas.getContext('2d');
  const id = nc.createImageData(256, 256);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 40 | 0;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = (Math.random() * 28) | 0;
  }
  nc.putImageData(id, 0, 0);
}
function applyFilmGrain() {
  if (!_noiseCanvas) _buildNoise();
  ctx.save();
  ctx.globalAlpha = 0.20;
  ctx.globalCompositeOperation = 'source-over';
  const ox = (Math.random() * 256) | 0, oy = (Math.random() * 256) | 0;
  for (let x = -256; x < BASE_W + 256; x += 256)
    for (let y = -256; y < BASE_H + 256; y += 256)
      ctx.drawImage(_noiseCanvas, x + ox, y + oy);
  ctx.restore();
}

function applyVignette() {
  const fearRatio = player.fear / 100;
  const innerR = 0.45 - fearRatio * 0.3;
  const outerR = 0.75 - fearRatio * 0.15;
  const alpha = 0.55 + fearRatio * 0.35;
  const cx = BASE_W / 2, cy = BASE_H / 2;
  const r = Math.max(BASE_W, BASE_H) * 0.85;
  const grad = ctx.createRadialGradient(cx, cy, r * innerR, cx, cy, r * outerR);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, `rgba(0,0,0,${alpha})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
}

function drawUI() {
  // Battery bar
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#111';
  ctx.fillRect(10, 10, 100, 10);
  const batColor = player.battery > 50 ? '#40c040' : player.battery > 20 ? '#c0c020' : '#c03020';
  ctx.fillStyle = batColor;
  ctx.fillRect(10, 10, player.battery, 10);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, 100, 10);
  // Battery icon
  ctx.fillStyle = '#888';
  ctx.font = '8px monospace';
  ctx.fillText('BAT', 12, 30);

  // Key icons
  for (let i = 0; i < 3; i++) {
    const kx = 10 + i * 22;
    const ky = 38;
    const collected = i < player.keysCollected;
    if (collected) {
      ctx.fillStyle = 'rgba(200, 140, 20, 0.9)';
      ctx.beginPath();
      for (let j = 0; j < 5; j++) {
        const ang = (j / 5) * Math.PI * 2 - Math.PI / 2;
        const r = 7;
        if (j === 0) ctx.moveTo(kx + Math.cos(ang) * r, ky + Math.sin(ang) * r);
        else ctx.lineTo(kx + Math.cos(ang) * r, ky + Math.sin(ang) * r);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let j = 0; j < 5; j++) {
        const ang = (j / 5) * Math.PI * 2 - Math.PI / 2;
        const r = 7;
        if (j === 0) ctx.moveTo(kx + Math.cos(ang) * r, ky + Math.sin(ang) * r);
        else ctx.lineTo(kx + Math.cos(ang) * r, ky + Math.sin(ang) * r);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }

  // Hide prompt
  if (player.nearLocker && !player.hiding && lockers[player.lockerIndex] && lockers[player.lockerIndex].cooldown <= 0) {
    ctx.fillStyle = 'rgba(80, 200, 80, 0.7)';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('[H] HIDE', BASE_W / 2, BASE_H - 20);
  }

  // Flashlight indicator
  ctx.fillStyle = player.flashlight ? 'rgba(255,220,80,0.7)' : 'rgba(80,80,80,0.5)';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(player.flashlight ? 'LIGHT ON' : 'LIGHT OFF', 118, 30);

  // Level indicator
  ctx.fillStyle = 'rgba(180,180,160,0.7)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`WARD ${currentLevel + 1}/5`, 10, 35);

  // Fear bar
  const fearBarW = 60, fearBarH = 6, fearX = 10, fearY = 48;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(fearX, fearY, fearBarW, fearBarH);
  const fearColor = player.fear < 40 ? '#446644' : player.fear < 70 ? '#886622' : '#882222';
  ctx.fillStyle = fearColor;
  ctx.fillRect(fearX, fearY, fearBarW * (player.fear / 100), fearBarH);
  ctx.strokeStyle = 'rgba(180,140,100,0.4)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(fearX, fearY, fearBarW, fearBarH);
  ctx.fillStyle = fearColor;
  ctx.font = '7px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('FEAR', fearX + fearBarW + 4, fearY + fearBarH);

  // Hiding status
  if (player.hiding) {
    ctx.fillStyle = 'rgba(60,180,60,0.85)';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('[ HIDING ]', BASE_W / 2, 18);
  }

  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawTouchControls() {
  ctx.save();
  ctx.globalAlpha = 0.55;

  // Joystick base
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(JOY_CX, JOY_CY, JOY_R, 0, Math.PI * 2);
  ctx.stroke();

  // Joystick stick
  let stickX = JOY_CX, stickY = JOY_CY;
  if (touch.active) {
    stickX = JOY_CX + touch.dx * JOY_R;
  }
  ctx.fillStyle = '#ffffff55';
  ctx.beginPath();
  ctx.arc(stickX, stickY, 22, 0, Math.PI * 2);
  ctx.fill();

  // Flashlight button
  ctx.globalAlpha = 0.7;
  ctx.strokeStyle = '#ffdd44';
  ctx.lineWidth = 2;
  ctx.strokeRect(BTN_FLASH_X, BTN_FLASH_Y, BTN_W, BTN_H);
  ctx.fillStyle = '#111';
  ctx.fillRect(BTN_FLASH_X + 1, BTN_FLASH_Y + 1, BTN_W - 2, BTN_H - 2);
  // Torch icon
  ctx.strokeStyle = '#ffdd44';
  ctx.lineWidth = 2;
  const tbx = BTN_FLASH_X + BTN_W / 2, tby = BTN_FLASH_Y + BTN_H / 2;
  ctx.beginPath();
  ctx.moveTo(tbx, tby + 18); ctx.lineTo(tbx, tby - 5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tbx - 8, tby - 5); ctx.lineTo(tbx + 8, tby - 5);
  ctx.lineTo(tbx + 5, tby - 18); ctx.lineTo(tbx - 5, tby - 18);
  ctx.closePath();
  ctx.stroke();
  // Rays
  ctx.beginPath(); ctx.moveTo(tbx - 10, tby - 22); ctx.lineTo(tbx - 14, tby - 26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tbx, tby - 23); ctx.lineTo(tbx, tby - 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tbx + 10, tby - 22); ctx.lineTo(tbx + 14, tby - 26); ctx.stroke();

  // Hide button
  ctx.strokeStyle = '#44cc88';
  ctx.lineWidth = 2;
  ctx.strokeRect(BTN_HIDE_X, BTN_HIDE_Y, BTN_W, BTN_H);
  ctx.fillStyle = '#111';
  ctx.fillRect(BTN_HIDE_X + 1, BTN_HIDE_Y + 1, BTN_W - 2, BTN_H - 2);
  // Eye-slash icon
  ctx.strokeStyle = '#44cc88';
  ctx.lineWidth = 2;
  const ebx = BTN_HIDE_X + BTN_W / 2, eby = BTN_HIDE_Y + BTN_H / 2;
  ctx.beginPath();
  ctx.ellipse(ebx, eby, 16, 10, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(ebx, eby, 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ebx - 18, eby - 15); ctx.lineTo(ebx + 18, eby + 15);
  ctx.stroke();

  ctx.restore();
}

// ==================== HEARTBEAT SYSTEM ====================
let lastHeartbeatTime = 0;
function updateHeartbeat(now) {
  const bpm = 60 + (player.fear / 100) * 40;
  const interval = (60 / bpm) * 1000;
  if (now - lastHeartbeatTime >= interval) {
    if (player.fear > 30 && !player.dead && !player.won) {
      playHeartbeat(bpm);
    }
    lastHeartbeatTime = now;
  }
}

// ==================== SCREENS ====================
function drawStartScreen() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // Film grain on start
  for (let i = 0; i < BASE_W * BASE_H / 30; i++) {
    const gx = Math.random() * BASE_W;
    const gy = Math.random() * BASE_H;
    ctx.fillStyle = `rgba(${Math.floor(Math.random() * 30)}, ${Math.floor(Math.random() * 30)}, ${Math.floor(Math.random() * 30)}, 0.4)`;
    ctx.fillRect(gx, gy, 1, 1);
  }

  // Vignette
  const grad = ctx.createRadialGradient(BASE_W / 2, BASE_H / 2, 100, BASE_W / 2, BASE_H / 2, BASE_W * 0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // Title
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cc3333';
  ctx.font = 'bold 42px serif';
  ctx.fillText('ECHOES OF', BASE_W / 2, BASE_H / 2 - 60);
  ctx.fillStyle = '#aa2222';
  ctx.font = 'bold 50px serif';
  ctx.fillText('WARD 13', BASE_W / 2, BASE_H / 2 - 15);
  ctx.fillStyle = '#554444';
  ctx.font = '13px monospace';
  ctx.fillText('A SURVIVAL HORROR EXPERIENCE', BASE_W / 2, BASE_H / 2 + 20);
  ctx.fillStyle = '#445544';
  ctx.font = '11px monospace';
  ctx.fillText('Collect 3 keys. Reach the exit. Do not be caught.', BASE_W / 2, BASE_H / 2 + 48);
  const blink = Math.floor(frameCount / 30) % 2 === 0;
  if (blink) {
    ctx.fillStyle = '#888';
    ctx.font = '13px monospace';
    ctx.fillText('PRESS ANY KEY OR TAP TO BEGIN', BASE_W / 2, BASE_H / 2 + 80);
  }
  ctx.fillStyle = '#333';
  ctx.font = '9px monospace';
  ctx.fillText('ARROW KEYS / WASD: MOVE   F: FLASHLIGHT   H: HIDE   ESC: PAUSE', BASE_W / 2, BASE_H - 20);
  const saved = loadProgress();
  if (saved > 0) {
    ctx.fillStyle = 'rgba(150,120,60,0.85)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`[ Saved progress: Ward ${saved + 1} ]`, BASE_W / 2, BASE_H - 36);
    ctx.fillStyle = '#333';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('[L] LEVEL SELECT', BASE_W - 12, BASE_H - 14);
  }
  ctx.fillStyle = '#333';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('[?] HOW TO PLAY', 12, BASE_H - 14);
  ctx.restore();
}

function drawDeadScreen() {
  deathFlashTimer += 16;
  const flashAlpha = Math.max(0, 0.7 - deathFlashTimer / 500);
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(180,0,0,${flashAlpha})`;
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  const flash = Math.min(1, (frameCount % 60) / 30);
  ctx.fillStyle = `rgba(180, 0, 0, ${0.3 * flash})`;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cc2222';
  ctx.font = 'bold 52px serif';
  const shk = Math.random() * 3 - 1.5;
  ctx.fillText('CAUGHT', BASE_W / 2 + shk, BASE_H / 2 - 20);
  ctx.fillStyle = '#553333';
  ctx.font = '14px monospace';
  ctx.fillText('The Patient has found you.', BASE_W / 2, BASE_H / 2 + 20);
  const blink = Math.floor(frameCount / 30) % 2 === 0;
  if (blink) {
    ctx.fillStyle = '#666';
    ctx.font = '12px monospace';
    ctx.fillText('PRESS ANY KEY OR TAP TO RESTART', BASE_W / 2, BASE_H / 2 + 60);
  }
  ctx.restore();
}

function drawWinScreen() {
  const prog = Math.min(1, frameCount / 120);
  ctx.fillStyle = `rgba(230, 230, 220, ${prog * 0.95})`;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  if (prog > 0.5) {
    const alpha = (prog - 0.5) * 2;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(30, 60, 30, ${alpha})`;
    ctx.font = 'bold 46px serif';
    ctx.fillText('YOU ESCAPED', BASE_W / 2, BASE_H / 2 - 40);
    ctx.fillStyle = `rgba(50, 80, 50, ${alpha})`;
    ctx.font = '14px monospace';
    ctx.fillText('ALL WARDS CLEARED', BASE_W / 2, BASE_H / 2 - 10);
    ctx.fillText('You escaped Echoes of Ward 13.', BASE_W / 2, BASE_H / 2 + 15);
    const blink = Math.floor(frameCount / 30) % 2 === 0;
    if (blink && prog > 0.9) {
      ctx.fillStyle = `rgba(60, 80, 60, ${alpha})`;
      ctx.font = '12px monospace';
      ctx.fillText('PRESS ANY KEY OR TAP TO PLAY AGAIN', BASE_W / 2, BASE_H / 2 + 80);
    }
    ctx.restore();
  }
}

function drawLevelComplete() {
  const prog = Math.min(1, frameCount / 90);
  ctx.fillStyle = `rgba(0,0,0,${prog * 0.85})`;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  if (prog > 0.4) {
    const alpha = (prog - 0.4) / 0.6;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(180, 30, 30, ${alpha})`;
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`LEVEL ${currentLevel + 1} COMPLETE`, BASE_W / 2, BASE_H / 2 - 50);
    ctx.fillStyle = `rgba(200, 200, 180, ${alpha})`;
    ctx.font = 'bold 28px serif';
    ctx.fillText(LEVELS[currentLevel].name.toUpperCase(), BASE_W / 2, BASE_H / 2 - 15);
    ctx.fillStyle = `rgba(160, 160, 140, ${alpha})`;
    ctx.font = '13px monospace';
    ctx.fillText(LEVELS[currentLevel + 1] ? `Next: ${LEVELS[currentLevel + 1].name}` : 'Final level awaits...', BASE_W / 2, BASE_H / 2 + 18);
    const blink = Math.floor(frameCount / 25) % 2 === 0;
    if (blink && prog > 0.8) {
      ctx.fillStyle = `rgba(140, 140, 120, ${alpha})`;
      ctx.font = '11px monospace';
      ctx.fillText('PRESS ANY KEY OR TAP TO CONTINUE', BASE_W / 2, BASE_H / 2 + 55);
    }
    ctx.restore();
  }
}

function drawHowToPlay() {
  ctx.save();
  ctx.fillStyle = '#08080e';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  applyFilmGrain();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#cc2222';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('HOW TO PLAY', BASE_W/2, 28);

  const items = [
    { icon: '⚡', label: 'FLASHLIGHT', desc: 'Press F or tap button to toggle. Battery drains while on. Find batteries to recharge.' },
    { icon: '💀', label: 'FEAR',       desc: 'Grows in darkness and near The Patient. High fear = louder heartbeat = more danger.' },
    { icon: '👁', label: 'HIDING',     desc: 'Press H near a locker to hide for 5s. Fear drops. 10s cooldown between uses.' },
    { icon: '🗝', label: 'KEYS',       desc: 'Collect all 3 glowing keys on each ward. Then reach the EXIT door on the right.' },
    { icon: '👣', label: 'THE PATIENT',desc: 'Blind but hears footsteps. Walk slowly, use lockers, stay in light when safe.' },
  ];

  items.forEach((item, i) => {
    const y = 65 + i * 68;
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(40, y - 22, BASE_W - 80, 58);
    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 1;
    ctx.strokeRect(40, y - 22, BASE_W - 80, 58);
    // Icon box
    ctx.fillStyle = '#cc222230';
    ctx.fillRect(40, y - 22, 44, 58);
    ctx.fillStyle = '#cc4444';
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.fillText(item.icon, 62, y + 12);
    // Label
    ctx.fillStyle = '#d0c8b0';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(item.label, 94, y - 6);
    // Desc
    ctx.fillStyle = '#888880';
    ctx.font = '9px monospace';
    ctx.fillText(item.desc, 94, y + 10);
    // Wrap second line if long
    if (item.desc.length > 62) {
      ctx.fillText(item.desc.substring(62), 94, y + 22);
    }
  });

  const blink = Math.floor(frameCount / 30) % 2 === 0;
  if (blink) {
    ctx.fillStyle = '#666';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS ESC OR TAP TO RETURN', BASE_W/2, BASE_H - 14);
  }
  ctx.restore();
}

let levelSelectIndex = 0;
function drawLevelSelect() {
  ctx.save();
  ctx.fillStyle = '#08080e';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  applyFilmGrain();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#cc2222';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('SELECT WARD', BASE_W/2, 30);

  const maxUnlocked = loadMaxLevel();
  const wardNames = LEVELS.map(l => l.name);

  wardNames.forEach((name, i) => {
    const unlocked = i <= maxUnlocked;
    const y = 68 + i * 62;
    ctx.fillStyle = unlocked ? '#1a1a2a' : '#0e0e14';
    ctx.fillRect(80, y - 20, BASE_W - 160, 50);
    ctx.strokeStyle = (i === levelSelectIndex && unlocked) ? '#cc2222' : '#222230';
    ctx.lineWidth = i === levelSelectIndex ? 2 : 1;
    ctx.strokeRect(80, y - 20, BASE_W - 160, 50);
    ctx.fillStyle = unlocked ? '#d0c8b0' : '#333330';
    ctx.font = `bold 12px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`WARD ${i+1}: ${name.toUpperCase()}`, BASE_W/2, y + 2);
    if (!unlocked) {
      ctx.fillStyle = '#442222';
      ctx.font = '9px monospace';
      ctx.fillText('[ LOCKED ]', BASE_W/2, y + 16);
    } else {
      ctx.fillStyle = '#445544';
      ctx.font = '9px monospace';
      ctx.fillText(LEVELS[i].description, BASE_W/2, y + 16);
    }
  });

  ctx.fillStyle = '#555';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('UP/DOWN to select   ENTER to play   ESC to back', BASE_W/2, BASE_H - 14);
  ctx.restore();
}

function drawCredits() {
  ctx.save();
  ctx.fillStyle = '#06060a';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  applyFilmGrain();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#cc2222';
  ctx.font = 'bold 18px serif';
  ctx.fillText('ECHOES OF WARD 13', BASE_W/2, 40);
  ctx.fillStyle = '#554444';
  ctx.font = '11px monospace';
  ctx.fillText('A 5-WARD SURVIVAL HORROR EXPERIENCE', BASE_W/2, 60);

  const lines = [
    ['DESIGN & DEVELOPMENT', ''],
    ['Game Design', 'Ward 13 Project'],
    ['Programming', 'HTML5 Canvas + Web Audio API'],
    ['Art Direction', 'Procedural Silhouette Aesthetic'],
    ['Sound Design', 'Web Audio API Synthesis'],
    ['', ''],
    ['TECHNOLOGY', ''],
    ['Engine', 'Vanilla JavaScript — No frameworks'],
    ['Audio', 'Web Audio API'],
    ['Renderer', 'HTML5 Canvas 2D'],
    ['Platform', 'Browser / Mobile / Capacitor APK'],
    ['', ''],
    ['INSPIRED BY', ''],
    ['Lone Survivor', 'Darkwood  ·  Limbo  ·  The Coma'],
    ['', ''],
    ['Thank you for playing.', ''],
  ];

  let y = 92;
  for (const [left, right] of lines) {
    if (!left && !right) { y += 8; continue; }
    if (!right) {
      ctx.fillStyle = '#882222';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(left.toUpperCase(), BASE_W/2, y);
    } else {
      ctx.fillStyle = '#888880';
      ctx.font = '9px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(left, BASE_W/2 - 8, y);
      ctx.fillStyle = '#c0b8a0';
      ctx.textAlign = 'left';
      ctx.fillText(right, BASE_W/2 + 8, y);
    }
    y += 16;
  }

  const blink = Math.floor(frameCount / 30) % 2 === 0;
  if (blink) {
    ctx.fillStyle = '#555';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ESC TO RETURN', BASE_W/2, BASE_H - 14);
  }
  ctx.restore();
}

// ==================== PAUSE MENU ====================
function drawPauseMenu() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cc2222';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('— PAUSED —', BASE_W / 2, BASE_H / 2 - 62);
  ctx.fillStyle = '#d0c8b0';
  ctx.font = '15px monospace';
  ctx.fillText('[R]  Resume', BASE_W / 2, BASE_H / 2 - 20);
  ctx.fillText('[N]  Restart Level', BASE_W / 2, BASE_H / 2 + 10);
  ctx.fillText('[M]  Main Menu', BASE_W / 2, BASE_H / 2 + 40);
  ctx.fillText('[C]  Credits', BASE_W / 2, BASE_H / 2 + 70);
  ctx.fillStyle = '#555';
  ctx.font = '10px monospace';
  ctx.fillText('ESC to resume', BASE_W / 2, BASE_H / 2 + 100);
  ctx.restore();
}

// ==================== SAVE / PROGRESS ====================
function saveProgress(level) {
  try { localStorage.setItem('ward13_level', level); } catch(e) {}
}
function loadProgress() {
  try { return parseInt(localStorage.getItem('ward13_level') || '0', 10); } catch(e) { return 0; }
}
function saveMaxLevel(level) {
  try {
    const current = loadMaxLevel();
    if (level > current) localStorage.setItem('ward13_max', level);
  } catch(e) {}
}
function loadMaxLevel() {
  try { return parseInt(localStorage.getItem('ward13_max') || '0', 10); } catch(e) { return 0; }
}

// ==================== GAME INIT ====================
function advanceLevel() {
  loadLevel(currentLevel + 1);
  saveProgress(currentLevel);
  saveMaxLevel(currentLevel);
  resetPlayer();
  resetEntity();
  camera.x = 0;
  frameCount = 0;
  lastFootstep = 0;
  lastHeartbeatTime = 0;
  entityProximityTimer = 0;
  deathFlashTimer = 0;
  state = 'levelIntro';
  levelIntroTimer = 0;
  btnFlashPressedThisFrame = false;
  btnHidePressedThisFrame = false;
}

function drawLevelIntro() {
  const prog = Math.min(1, levelIntroTimer / 2500);
  const alpha = prog < 0.15 ? prog / 0.15 : prog > 0.75 ? (1 - prog) / 0.25 : 1;
  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${alpha * 0.82})`;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(180,40,40,${alpha})`;
  ctx.font = 'bold 11px monospace';
  ctx.fillText(`WARD ${currentLevel + 1}`, BASE_W/2, BASE_H/2 - 38);
  ctx.fillStyle = `rgba(210,200,180,${alpha})`;
  ctx.font = 'bold 26px serif';
  ctx.fillText(levelData.name.toUpperCase(), BASE_W/2, BASE_H/2 - 8);
  ctx.fillStyle = `rgba(160,150,130,${alpha})`;
  ctx.font = '12px monospace';
  ctx.fillText(levelData.description, BASE_W/2, BASE_H/2 + 22);
  ctx.restore();
}

function startGame() {
  initAudio();
  loadLevel(loadProgress());
  resetPlayer();
  resetEntity();
  camera.x = 0;
  frameCount = 0;
  lastFootstep = 0;
  lastHeartbeatTime = 0;
  entityProximityTimer = 0;
  deathFlashTimer = 0;
  state = 'levelIntro';
  levelIntroTimer = 0;
  btnFlashPressedThisFrame = false;
  btnHidePressedThisFrame = false;
}

// ==================== MAIN LOOP ====================
let lastTime = 0;
function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  frameCount++;

  ctx.save();

  if (state === 'start') {
    drawStartScreen();
    ctx.restore();
    return;
  }

  if (state === 'levelIntro') {
    levelIntroTimer += dt;
    renderGame();
    drawLevelIntro();
    if (levelIntroTimer >= 2500) state = 'playing';
    ctx.restore();
    return;
  }

  if (state === 'dead') {
    // Draw game behind
    renderGame();
    drawDeadScreen();
    ctx.restore();
    return;
  }


  if (state === 'win') {
    renderGame();
    drawWinScreen();
    ctx.restore();
    return;
  }

  if (state === 'levelComplete') {
    renderGame();
    drawLevelComplete();
    ctx.restore();
    return;
  }

  if (state === 'howToPlay') {
    ctx.save();
    drawHowToPlay();
    ctx.restore();
    ctx.restore();
    return;
  }

  if (state === 'levelSelect') {
    ctx.save();
    drawLevelSelect();
    ctx.restore();
    ctx.restore();
    return;
  }

  if (state === 'credits') {
    ctx.save();
    drawCredits();
    ctx.restore();
    ctx.restore();
    return;
  }

  if (state === 'paused') {
    renderGame();
    drawPauseMenu();
    ctx.restore();
    return;
  }

  // Playing
  updatePlayer(dt);
  updateEntity(dt);
  updateChaseMusic();
  updateCamera();
  updateHeartbeat(ts);

  renderGame();

  // Touch controls
  drawTouchControls();

  // Clear frame presses
  btnFlashPressedThisFrame = false;
  btnHidePressedThisFrame = false;

  ctx.restore();
}

function renderGame() {
  ctx.save();
  const shakeX = (state === 'dead' && deathFlashTimer < 400) ? (Math.random() - 0.5) * 10 : player.shakeX;
  const shakeY = (state === 'dead' && deathFlashTimer < 400) ? (Math.random() - 0.5) * 6  : player.shakeY;
  ctx.translate(shakeX, shakeY);

  // 1. Background
  drawBackground();

  // 2. Blood smears
  for (const smear of bloodSmears) drawBloodSmear(smear);

  // 3. Obstacles
  for (const obs of obstacles) drawObstacle(obs);

  // 4. Lockers
  for (const lk of lockers) drawLocker(lk);

  // 5. Batteries
  for (const bat of batteries) drawBattery(bat);

  // 6. Keys
  for (const ki of keyItems) drawKey(ki);

  // 7. Exit door
  drawExitDoor();

  // 8. Entity (draw behind darkness so flashlight reveals it)
  drawEntity();

  // 8b. Entity2 on level 5
  if (currentLevel === 4 && entity2) {
    drawEntity2();
  }

  // 9. Player
  drawPlayer();

  ctx.restore();

  // 10. Flashlight overlay (darkness with cone cutout)
  if (state === 'playing' || state === 'dead' || state === 'win' || state === 'levelComplete') {
    if (player.flashlight && !player.hiding) {
      applyFlashlightMask();
    } else {
      applyDarknessOverlay();
    }
  }

  // 11. Film grain
  applyFilmGrain();

  // 12. Vignette
  if (state === 'playing') applyVignette();

  // 13. UI
  if (state === 'playing') drawUI();
}

// Kick off
requestAnimationFrame(gameLoop);
</script>
