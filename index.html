<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<title>Echoes of Ward 13</title>
	<script type="text/javascript" src="framework/phaser.min.js"></script>
	<script type="text/javascript" src="js/states/load.js"></script>
	<script type="text/javascript" src="js/states/menu.js"></script>
	<script type="text/javascript" src="js/states/controls.js"></script>
	<script type="text/javascript" src="js/states/play.js"></script>
	<script type="text/javascript" src="js/states/end.js"></script>
	<script type="text/javascript" src="js/states/game.js"></script>
	<script type="text/javascript" src="js/prefabs/Enemy.js"></script>
	<script type="text/javascript" src="js/prefabs/Obstacle.js"></script>
	<script type="text/javascript" src="js/prefabs/Door.js"></script>
	<script type="text/javascript" src="js/prefabs/KeyCard.js"></script>
	<script type="text/javascript" src="js/prefabs/Note.js"></script>
	<link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>

	<h1>Echoes of Ward 13</h1>

	<div id="gameDiv"></div>

	<div id="gameControls">
		<div id="ctrl-left">
			<div id="dpad">
				<button class="ctrl-btn" id="btn-up" data-keycode="38" data-key="ArrowUp">&#9650;</button>
				<div id="dpad-row">
					<button class="ctrl-btn" id="btn-left" data-keycode="37" data-key="ArrowLeft">&#9664;</button>
					<button class="ctrl-btn" id="btn-down" data-keycode="40" data-key="ArrowDown">&#9660;</button>
					<button class="ctrl-btn" id="btn-right" data-keycode="39" data-key="ArrowRight">&#9654;</button>
				</div>
			</div>
			<button class="ctrl-btn action-btn" id="btn-sprint" data-keycode="16" data-key="Shift">SPRINT</button>
		</div>
		<div id="ctrl-right">
			<button class="ctrl-btn jump-btn" id="btn-jump" data-keycode="32" data-key=" ">JUMP</button>
			<div id="action-row">
				<button class="ctrl-btn action-btn" id="btn-hide" data-keycode="72" data-key="h">HIDE<br><small>H</small></button>
				<button class="ctrl-btn action-btn" id="btn-interact" data-keycode="69" data-key="e">USE<br><small>E</small></button>
				<button class="ctrl-btn action-btn" id="btn-inventory" data-keycode="73" data-key="i">INV<br><small>I</small></button>
			</div>
		</div>
	</div>

	<script>
	(function () {
		var held = {};

		function fire(keyCode, key, type) {
			var evt = new KeyboardEvent(type, {
				keyCode: keyCode, which: keyCode, key: key,
				bubbles: true, cancelable: true
			});
			document.dispatchEvent(evt);
		}

		function setup(btn) {
			var kc = parseInt(btn.dataset.keycode, 10);
			var k  = btn.dataset.key;

			function down(e) {
				e.preventDefault();
				if (!held[kc]) { held[kc] = true; fire(kc, k, 'keydown'); }
			}
			function up(e) {
				e.preventDefault();
				if (held[kc]) { held[kc] = false; fire(kc, k, 'keyup'); }
			}

			btn.addEventListener('touchstart',  down, { passive: false });
			btn.addEventListener('touchend',    up,   { passive: false });
			btn.addEventListener('touchcancel', up,   { passive: false });
			btn.addEventListener('mousedown', down);
			btn.addEventListener('mouseup',   up);
			btn.addEventListener('mouseleave', up);
		}

		document.querySelectorAll('#gameControls .ctrl-btn').forEach(setup);
	})();
	</script>
</body>
</html>
